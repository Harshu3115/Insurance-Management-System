<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance Login</title>
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 (free) for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <link rel="stylesheet" href="/css/login.css">
</head>
<body>

  <div class="login-card card">
    <div class="card-inner">

      <!-- header with icon -->
      <div class="login-header">
        <div class="icon-circle">
          <i class="fas fa-shield-alt"></i>
        </div>
        <h3>Secure Login</h3>
        <span class="subhead"><i class="fas fa-lock me-1" style="opacity:0.7;"></i> Insurance portal</span>
      </div>

      <!-- login form -->
      <form id="loginForm">

        <!-- username field -->
        <div class="form-floating-custom">
          <input type="text" 
                 name="username" 
                 id="username" 
                 class="form-control" 
                 placeholder="Username or email" 
                 autocomplete="username" 
                 required>
          <i class="fas fa-user input-icon"></i>
          <label for="username">Username</label>
        </div>

        <!-- password field -->
        <div class="form-floating-custom">
          <input type="password" 
                 name="password" 
                 id="password" 
                 class="form-control" 
                 placeholder="Enter your password" 
                 autocomplete="current-password" 
                 required>
          <i class="fas fa-key input-icon"></i>
          <label for="password">Password</label>
        </div>

        <!-- remember & forgot row (inline) -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me">
            <label class="form-check-label" for="rememberMe" style="font-size:0.9rem;">
              Keep me signed in
            </label>
          </div>
          <a href="#" style="font-size:0.9rem; font-weight:500; color:#1a3a6b; text-decoration:none; border-bottom:1px solid transparent;">
            Forgot?
          </a>
        </div>

        <!-- login button -->
        <button class="btn btn-login" type="submit">
		    <span>Log in</span>
		    <i class="fas fa-arrow-right"></i>
		</button>

        <!-- footer links -->
        <div class="login-footer">
          <span class="text-muted-soft" style="font-weight:400;">New to our platform?</span>
          <a href="#" class="register-link">Create account <i class="fas fa-chevron-right" style="font-size:0.7rem;"></i></a>
        </div>

        <!-- hidden extra: demo hint (just for style) -->
        <div class="mt-3 text-center" style="font-size:0.7rem; color:#6f8aa8; letter-spacing:0.02em;">
          <i class="fas fa-lock me-1" style="opacity:0.5;"></i> Secure · 256-bit encryption
        </div>
      </form>

    </div> <!-- end card-inner -->
  </div> <!-- end login-card -->

  <!-- Bootstrap JS (optional, for toggles etc) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
